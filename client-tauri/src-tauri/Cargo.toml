[package]
name = "brandon"
version = "0.1.0"
description = "Brandon — live interview AI assistant"
authors = ["Brandon"]
edition = "2021"
rust-version = "1.77"

# The library is what Tauri's mobile tooling and the binary both link against;
# desktop-only here but keeping the split is the Tauri v2 convention.
[lib]
name = "brandon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Tauri's default custom-protocol feature is enabled in release builds by the CLI.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

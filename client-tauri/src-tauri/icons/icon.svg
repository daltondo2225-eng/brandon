    <rect x="158" y="201" width="34" height="110" rx="17"/>
    <rect x="200" y="162" width="34" height="188" rx="17"/>
    <rect x="242" y="126" width="34" height="260" rx="17"/>
    <rect x="284" y="178" width="34" height="156" rx="17"/>

       Mirrors src/lib/BrandMark.tsx. Keep in sync. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ea8ff"/>

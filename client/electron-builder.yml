appId: com.brandon.app
productName: Brandon
copyright: Copyright (c) 2026 Brandon
asar: true
# electron-builder can't auto-detect the Electron version when it's hoisted to
# the workspace root, so we pin it explicitly here. Keep in sync with the
# `electron` devDependency in client/package.json.
electronVersion: "35.0.0"
directories:
  output: release
  buildResources: resources

files:
  - "out/**/*"
  - "package.json"
  - "!**/{.eslintrc,.gitignore,.prettierrc}"

# The client is thin (talks to a remote server — no bundled Node server). The
# only native companion is the Windows captions sidecar (BrandonCaptions.exe),
# published into resources/bin by the CI before packaging. If resources/bin is
# empty (e.g. a non-Windows local build), the app still runs and shows a
# "captions unavailable" hint instead of crashing.
extraResources:
  - from: resources/icons
    to: icons
    filter: ["**/*"]
  - from: resources/bin
    to: bin
    filter: ["**/*", "!.gitkeep"]

win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Brandon
  createDesktopShortcut: true
  createStartMenuShortcut: true

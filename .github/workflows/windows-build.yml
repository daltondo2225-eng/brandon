name: Build Windows installer

# Build the Brandon Windows app (.exe NSIS installer) on a real Windows runner.
# Triggered manually, or automatically when you push a version tag like v0.1.0.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Build the captions sidecar (.NET 8, self-contained single-file win-x64)
      # straight into client/resources/bin so electron-builder bundles it as an
      # extra resource. The client spawns resources/bin/BrandonCaptions.exe.
      - name: Publish captions sidecar
        run: >
          dotnet publish sidecar/BrandonCaptions/BrandonCaptions.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o client/resources/bin --nologo

      - name: Verify sidecar built
        run: |
          if (-not (Test-Path client/resources/bin/BrandonCaptions.exe)) {
            throw "BrandonCaptions.exe not found after publish"
          }
          Get-ChildItem client/resources/bin | Format-Table Name, Length
        shell: pwsh

      # Install the whole workspace (shared/server/client). The client consumes
      # @brandon/shared directly from source, so no separate shared build step.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck client
        run: npm --workspace client run typecheck

      # 1) Build the renderer/main/preload bundles (no packaging yet).
      - name: Build app bundles
        run: npm --workspace client run build

      # 2) electron-builder's native helper (app-builder.exe) can be missing or
      #    get pruned under npm workspaces on Windows → "spawn ... ENOENT".
      #    Resolve the path electron-builder will actually use, and download the
      #    binary straight into it if absent. Done right before packaging so
      #    nothing can prune it afterward.
      - name: Ensure app-builder.exe is present
        shell: pwsh
        run: |
          $exe = "node_modules/app-builder-bin/win/x64/app-builder.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $exe) | Out-Null
          if (-not (Test-Path $exe)) {
            Write-Host "app-builder.exe missing — fetching from registry tarball"
            $tgz = "$env:RUNNER_TEMP\abb.tgz"
            Invoke-WebRequest -Uri "https://registry.npmjs.org/app-builder-bin/-/app-builder-bin-5.0.0-alpha.10.tgz" -OutFile $tgz
            tar -xzf $tgz -C $env:RUNNER_TEMP
            Copy-Item "$env:RUNNER_TEMP\package\win\x64\app-builder.exe" $exe -Force
          }
          if (-not (Test-Path $exe)) { throw "app-builder.exe still missing" }
          Write-Host ("OK: {0} ({1} bytes)" -f $exe, (Get-Item $exe).Length)

      # 3) Package the NSIS installer. Skip native rebuild (no native deps) and
      #    auto code-signing discovery (unsigned build).
      - name: Package Windows installer
        working-directory: client
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --config electron-builder.yml --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: brandon-windows-installer
          path: client/release/*.exe
          if-no-files-found: error

      # When triggered by a version tag, also attach the installer to a GitHub
      # Release so users can download it directly.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
